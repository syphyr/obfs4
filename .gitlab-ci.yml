---
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - project: tpo/tpa/ci-templates
    file: debtpo.yml

variables:
  DOCKER_REGISTRY_URL: docker.io
  GITLAB_ADVANCED_SAST_ENABLED: 'true'

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: golang
  script:
    - test -z "$(go fmt ./...)"
    - go vet ./...
    - go test -v ./...
    - go build ./cmd/lyrebird

go-1.22:
  stage: test
  image: golang:1.22-bookworm
  script:
    - apt-get update
    - apt-get -qy install --no-install-recommends patch
    - patch -p1 < go-1.22.patch
    - go vet ./...
    - go test -v ./...
    - go build ./cmd/lyrebird

goreleaser:
  stage: build
  image:
    name: ${DOCKER_REGISTRY_URL}/goreleaser/goreleaser
    entrypoint: [""]
  variables:
    # Disable shallow cloning so that goreleaser can diff between tags to
    # generate a changelog.
    GIT_DEPTH: 0
  script:
    - |
      # remove untracked files so the repo is not dirty
      git clean -f
      if [ -z "$CI_COMMIT_TAG" ]
      then
        goreleaser release --snapshot --clean
      else
        goreleaser release --clean --skip publish
      fi
  artifacts:
    name: "${CI_PROJECT_PATH}_${CI_JOB_STAGE}_${CI_JOB_ID}_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHA}"
    paths:
      - dist/
      - debian/control
    expire_in: 1 week

upload-debtpo:
  extends: .debtpo
  stage: deploy
  before_script:
    # generate a .changes file for debtpo incoming processing
    - !reference [.debtpo-scripts, genchanges]
  rules:
    - if: $TORDEB_SSH_PRIVATE_KEY && $CI_COMMIT_TAG
  needs:
    - job: goreleaser
